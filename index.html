<body style="background-color:#8fb3c1; font-family:Arial;">

<!-- Banner -->
<div id="banner" style="
    background:#e6e1b5;
    border:2px solid black;
    width:700px;
    padding:15px;
    margin-bottom:15px;
">

    <h2>Things I Want to Explore in My Lifetime</h2>

    <ul id="list">
        <li>Master Full-Stack Web Development</li>
        <li>Build AI-powered applications</li>
        <li>Learn multiple programming languages</li>
        <li>Create innovative software solutions</li>
        <li>Travel and explore new cultures</li>
    </ul>

</div>

<label>Add New: </label>
<input type="text" id="inputItem" placeholder="new item">

<br><br>

<!-- Button to add new items from input field -->
<button onclick="addItem()" style="padding:15px; width:200px;">
    Add Item to List
</button>

<!-- Button to change font family of list items -->
<button onclick="changeFontFamily()" style="padding:15px; width:200px;">
    Change Font Family
</button>

<!-- Button to make list items bold -->
<button onclick="makeBold()" style="padding:15px; width:200px;">
    Make Items Bold
</button>

<script>
/**
 * Add a new item to the list from the input field value
 * Clears the input field after adding the item
 * Prevents empty items from being added
 */
function addItem() {
    let input = document.getElementById("inputItem").value;

    if(input === "") {
        alert("Please enter an item!");
        return;
    }

    let li = document.createElement("li");
    li.textContent = input;

    document.getElementById("list").appendChild(li);

    document.getElementById("inputItem").value = "";
}

/**
 * Change the font family of all list items
 * Cycles through common font families: Arial, Georgia, Courier New, Verdana
 */
function changeFontFamily() {
    let listItems = document.getElementById("list").getElementsByTagName("li");
    let currentFont = window.getComputedStyle(listItems[0]).fontFamily;
    let newFont;

    // Cycle through font families
    if(currentFont.includes("Arial")) {
        newFont = "Georgia";
    } else if(currentFont.includes("Georgia")) {
        newFont = "Courier New";
    } else if(currentFont.includes("Courier")) {
        newFont = "Verdana";
    } else {
        newFont = "Arial";
    }

    // Apply new font to all list items
    for(let i = 0; i < listItems.length; i++) {
        listItems[i].style.fontFamily = newFont;
    }
}

/**
 * Toggle bold styling on all list items
 * If items are already bold, remove the bold styling
 * If items are not bold, apply bold styling
 */
function makeBold() {
    let listItems = document.getElementById("list").getElementsByTagName("li");

    for(let i = 0; i < listItems.length; i++) {
        if(listItems[i].style.fontWeight === "bold") {
            listItems[i].style.fontWeight = "normal";
        } else {
            listItems[i].style.fontWeight = "bold";
        }
    }
}
</script>

</body>
